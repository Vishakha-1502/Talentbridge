server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talentbridge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Vishakha@15}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# AI Configuration (GroqCloud)
groq.api.key=${GROQ_API_KEY:gsk_placeholder_key}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:talentbridge.notifications@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multi-Platform External Jobs Configuration (LinkedIn, Naukri, Indeed, Glassdoor)
jobs.external.auto-sync=true
jobs.external.rapidapi-key=${RAPIDAPI_KEY:}
jobs.external.serpapi-key=${SERPAPI_KEY:}
